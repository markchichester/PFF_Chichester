<style>

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --fg:#eef1f5; --muted:#9aa5b3; --soft:#6d7886;
  --warm:#35c57a; --abs:#f2b72e; --lift:#ff5b4f; --cool:#5c94ff;

button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--lift);outline-offset:2px}

p{margin:0}

.btn.primary{background:var(--lift);color:var(--on-accent);border-color:transparent;font-family:var(--display);font-size:22px;letter-spacing:.06em;text-transform:uppercase;padding:14px 18px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}

.sess{padding:12px 14px;border-top:1px solid var(--line)}
.sess:first-child{border-top:0}
.sess summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.sess summary::-webkit-details-marker{display:none}
.sess .x{font-size:13px;color:var(--muted);margin-top:6px;display:flex;flex-direction:column;gap:3px}
.form{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}

.switch{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);position:relative;padding:0;flex:none;cursor:pointer}

.switch:checked::after{transform:translateX(18px);background:#fff}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:20px 20px 0 0;max-height:88vh;overflow:auto;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 4px}
.fig-box{background:var(--surface-2);border-radius:16px;padding:6px}

.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:4px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
ol.cues{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.adj{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{background:var(--surface-2);border-radius:14px;padding:8px;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;text-align:center}

.stepper .v{font-family:var(--display);font-size:26px;font-weight:700;line-height:1}
.stepper .u{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.player{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;--ph:var(--lift)}
.player .pin{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:12px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.p-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.clock{font-family:var(--display);font-size:26px;font-weight:700;line-height:1}
.clock span{font-size:16px;color:var(--muted);font-weight:600}
.delta{font-size:12.5px;font-weight:700;padding:5px 9px;border-radius:999px;background:var(--surface-2);white-space:nowrap}
.delta.ok{color:var(--good)} .delta.late{color:var(--bad)} .delta.early{color:var(--cool)}
.phasebar{position:relative;display:flex;gap:3px;height:8px}
.phasebar span{border-radius:4px;opacity:.35;height:100%}
.phasebar span.on{opacity:1}
.phasebar i{position:absolute;top:-4px;width:4px;height:16px;border-radius:2px;background:var(--fg);transform:translateX(-2px)}
.p-meta{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.p-meta .ph{color:var(--ph)}
.p-stage{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px;position:relative}
.p-stage canvas{width:100%;aspect-ratio:240/150;display:block;max-width:100%}
.p-badge{position:absolute;top:10px;left:12px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--ph);color:var(--on-accent);padding:3px 8px;border-radius:6px}
.p-title{font-family:var(--display);font-size:34px;line-height:1;font-weight:800;text-transform:uppercase}
.p-sub{color:var(--muted);font-weight:600;margin-top:4px}
.p-core{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:150px;height:150px;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-family:var(--display);font-size:56px;font-weight:800;line-height:.9}
.ring .lab{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.p-side{display:flex;flex-direction:column;gap:8px;min-width:0}
.p-msg{font-weight:600;line-height:1.3}
.p-hint{font-size:13px;color:var(--muted)}
.p-ctrl{display:grid;grid-template-columns:52px 52px 1fr 52px;gap:8px}
.p-ctrl .icon-btn{width:52px;height:56px;border-radius:14px}
.p-ctrl .go{border-radius:14px;background:var(--ph);color:var(--on-accent);font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.log{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.efforts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.efforts button{padding:8px 4px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;font-weight:700}
.efforts button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.next{display:flex;gap:10px;align-items:center;font-size:13.5px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.next canvas{width:60px;height:38px;flex:none}
.next > div{min-width:0}
.cuebox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.cuebox summary{font-weight:700;cursor:pointer}
.cuebox ol{margin:8px 0 2px}
.endbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prog{font-size:12.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--surface-2)}
.prog.up{color:var(--good)} .prog.hold{color:var(--muted)} .prog.down{color:var(--bad)}
@media (max-width:380px){.p-core{grid-template-columns:128px 1fr}.ring,.ring svg{width:128px;height:128px}.ring .big{font-size:46px}h1{font-size:38px}}
@media (prefers-reduced-motion: reduce){.switch::after{transition:none}}

<script>
"use strict";
/* ---------------- utilities ---------------- */
const $ = (s, r = document) => r.querySelector(s);

const fmt = sec => { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0"); };
const dayKey = (d = new Date()) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  hist: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>',
  lib: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.2"/><path d="M12 8v6l-3 6M12 14l3 6M7 10l5-1 5 1"/></svg>',

const EX = [];

let DB = null, UID = null, SYNC = "device", writeChain = Promise.resolve(), stateTimer = null;

async function initSync() {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    DB = db; UID = id;
    const snap = await stateDoc().get();
    if (snap.exists) {
      const r = JSON.parse(JSON.stringify(snap.data()));
      if ((r.updatedAt || 0) > (S.updatedAt || 0)) { S = normalize(r); lsSet(LS_STATE, S); }
      else if ((S.updatedAt || 0) > (r.updatedAt || 0)) queueRemoteState();
    } else if (S.updatedAt) queueRemoteState();
    const qs = await sessCol().orderBy("ts", "desc").limit(500).get();
    const remote = new Map(qs.docs.map(d => [d.id, JSON.parse(JSON.stringify(d.data()))]));
    const local = new Map(SESSIONS.map(s => [s.id, s]));
    SESSIONS.forEach(s => { if (!remote.has(s.id)) pushSession(s); });
    remote.forEach((v, k) => { if (!local.has(k)) local.set(k, v); });
    SESSIONS = [...local.values()].sort((a, b) => b.ts - a.ts);
    lsSet(LS_SESS, SESSIONS);
    SYNC = "cloud";
    if (!PL) render();
  } catch (e) { console.warn("sync unavailable", e); if (e && e.code === "invalid_argument") DB = null; }
}

function score(id) { const last = S.recent[id] || 0; const days = last ? (Date.now() - last) / 864e5 : 30; return Math.min(days, 21) + Math.random() * 5; }
function pool(slot, abs) { const ts = slot.split("|"); return EX.filter(x => (abs ? x.group === "abs" : (x.group !== "abs" && x.group !== "warm" && x.group !== "cool")) && ts.some(t => x.tags.includes(t))); }
function pick(slot, used, abs) { const c = pool(slot, abs).filter(x => !used.includes(x.id)); if (!c.length) return pool(slot, abs)[0].id; return c.map(x => [x.id, score(x.id)]).sort((a, b) => b[1] - a[1])[0][0]; }
const AB_SLOTS = ["ab_flex", "ab_lower", "ab_oblique", "ab_static"];
function genPlan(type) {
  const used = [], items = [];
  TYPES[type].slots.forEach(slot => { const id = pick(slot, used); used.push(id); items.push({ id, slot }); });
  const absU = [], abs = [];
  AB_SLOTS.forEach(slot => { const id = pick(slot, absU, true); absU.push(id); abs.push({ id, slot }); });
  const cool = [...COOL].sort(() => Math.random() - .5);
  return { v: 2, date: dayKey(), type, items, abs, cool };
}
function todayPlan() {
  if (!S.plan || S.plan.v !== 2 || S.plan.date !== dayKey()) { const t = S.lastType ? NEXT_TYPE[S.lastType] : "A"; S.plan = genPlan(t); save(); }
  return S.plan;
}
function setSec(id) { const x = EXM[id], st = exState(id); return st.r * repSec(x) * (x.side ? 2 : 1) + 6; }
function fit(plan) {
  const st = S.settings, T = TYPES[plan.type];
  const abPer = plan.abs.length * (st.abWork + st.abRest);
  const abRounds = clamp(Math.floor((st.abs * 60 - 20) / abPer), 1, 3);
  const absSec = abRounds * abPer + 20;
  const coolN = clamp(Math.round(st.cool * 60 / 30), 2, 6);
  const budget = st.total * 60 - st.warm * 60 - absSec - coolN * 30 - 30;
  let items = plan.items.map(it => { const x = EXM[it.id]; return { ...it, sets: 3, rest: Math.round((x.big ? st.restMain : st.restIso) * T.restMul) }; });
  const est = () => items.reduce((t, it) => t + it.sets * (setSec(it.id) + it.rest), 0) + 20;
  let g = 0;
  while (est() > budget && items.some(it => it.rest > 40) && g++ < 40) items.forEach(it => { if (it.rest > 40) it.rest -= 5; });
  g = 0;
  while (est() > budget && g++ < 20) { const c = [...items].reverse().find(it => it.sets > 2); if (c) c.sets--; else break; }

  const lift = est();
  return { items, abRounds, absSec, coolN, lift, warmSec: st.warm * 60, coolSec: coolN * 30, total: st.warm * 60 + absSec + lift + coolN * 30 };
}

let AC = null, VOICES = [];
function loadVoices() { try { VOICES = (speechSynthesis.getVoices() || []).filter(v => /^en/i.test(v.lang)); } catch (e) { VOICES = []; } }
try { loadVoices(); speechSynthesis.onvoiceschanged = () => { loadVoices(); if (TAB === "settings" && !PL) render(); }; } catch (e) { }
function pickVoice() { if (!VOICES.length) loadVoices(); return VOICES.find(v => v.voiceURI === S.settings.voiceURI) || VOICES.find(v => /Samantha|Google US English|Aria|Jenny|Ava/i.test(v.name)) || VOICES.find(v => v.lang === "en-US") || VOICES[0]; }
function say(text, flush) {
  if (!S.settings.voice || !text) return;
  try {
    if (flush) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); const v = pickVoice(); if (v) u.voice = v; u.rate = S.settings.rate; u.lang = v ? v.lang : "en-US";
    speechSynthesis.speak(u);
  } catch (e) { }
}
function unlockAudio() {
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume(); } catch (e) { }
  try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } catch (e) { }
}
function beep(f = 880, d = .12, vol = .25) {
  if (!S.settings.beeps || !AC) return;
  try { const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = f; o.type = "sine"; g.gain.setValueAtTime(vol, AC.currentTime); g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + d); o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + d + .02); } catch (e) { }
}
const tick = () => beep(1320, .05, .12);
const PRAISE = ["Strong work.", "That's how you build it.", "Good set.", "Clean reps.", "Keep that form.", "You're on track.", "Nice and controlled."];
const praise = () => PRAISE[Math.floor(Math.random() * PRAISE.length)];
let WAKE = null;
async function wake(on) { try { if (on && navigator.wakeLock && !WAKE) { WAKE = await navigator.wakeLock.request("screen"); WAKE.addEventListener("release", () => { WAKE = null; }); } else if (!on && WAKE) { await WAKE.release(); WAKE = null; } } catch (e) { WAKE = null; } }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && PL && !PL.done) wake(true); });

  updatePlayer();
}
function updatePlayer() {
  if (!PL || PL.done) return;
  const s = curStep(); if (!s) return;
  const el = stepEl(), A = activeEl();
  const big = $("#pBig"), lab = $("#pLab"), ring = $("#pRing"), msg = $("#pMsg"), hint = $("#pHint");
  if (!big) return;
  let frac = 0;
  if (s.k === "timed") { const rem = s.dur - el; big.textContent = rem >= 60 ? fmt(rem) : Math.ceil(Math.max(0, rem)); lab.textContent = "seconds left"; frac = el / s.dur; const x = EXM[s.id]; msg.textContent = x.side ? (el < s.dur / 2 ? "Side one" : "Side two") : (s.ph === "warm" ? warmMsg(el, s.dur) : x.cues[0]); hint.textContent = ""; }
  else if (s.k === "rest") { const d = restDur(), rem = d - el; big.textContent = Math.ceil(Math.max(0, rem)); lab.textContent = "rest"; frac = el / d; msg.textContent = s.trans ? "Set up your equipment" : "Breathe. Shake it out."; hint.textContent = PL.trim ? `Rest trimmed ${PL.trim}s to keep you on schedule` : PL.extra ? `+${PL.extra}s added` : ""; }
  else if (s.k === "set") {
    const x = EXM[s.id], c = PL.cur[s.id];
    if (PL.sub === "count") { const rem = 3 - el; big.textContent = Math.max(1, Math.ceil(rem)); lab.textContent = "get ready"; frac = el / 3; msg.textContent = "Get in position"; hint.textContent = "Tap Start set to begin sooner, or pause if you need more time."; }
    else if (PL.sub === "ready") { big.textContent = c.r; lab.textContent = "target reps"; frac = 0; msg.textContent = "Ready when you are"; hint.textContent = "Adjust weight or reps below before you start."; }
    else if (PL.sub === "go") {
      if (S.settings.tempoCoach) { big.textContent = PL.count; lab.textContent = `of ${c.r}${x.side ? (PL.side ? " · side 2" : " · side 1") : ""}`; const rs = repSec(x); frac = ((el - PL.goAt) / rs - (x.side && PL.side ? c.r : 0)) / c.r; msg.textContent = CON_FIRST.includes(x.pat) ? `1s lift, ${Math.round((rs - 1) * 10) / 10}s lower` : `${Math.round((rs - 1) * 10) / 10}s lower, 1s press`; hint.textContent = "Tap Done if you finish early. You can fix the count during rest."; }
      else { big.textContent = fmt(el - PL.goAt); lab.textContent = "set time"; frac = ((el - PL.goAt) % 60) / 60; msg.textContent = `${c.r} reps at your own pace`; hint.textContent = "Tap Done when you rack it."; }
    }
  }
  ring.style.strokeDashoffset = String(414.7 * (1 - clamp(frac, 0, 1)));
  $("#pEl").textContent = fmt(A);
  const plannedNow = s.at + Math.min(el, s.k === "rest" ? restDur() : s.plan);
  const delta = A - plannedNow;
  const dEl = $("#pDelta");
  if (Math.abs(delta) < 20) { dEl.textContent = "On pace"; dEl.className = "delta ok"; }
  else if (delta > 0) { dEl.textContent = fmt(delta) + " behind"; dEl.className = "delta late"; }
  else { dEl.textContent = fmt(-delta) + " ahead"; dEl.className = "delta early"; }
  const remaining = Math.max(0, PL.total - plannedNow);
  const fin = new Date(Date.now() + remaining * 1000);
  $("#pFinish").textContent = "Finish ~" + fin.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  $("#pmark").style.left = (100 * clamp(plannedNow / PL.total, 0, 1)) + "%";
}
function warmMsg(el, d) { if (el < 60) return "Brisk walk, 3–3.5 mph"; if (el < d * .6) return "Easy jog or 3–5% incline"; if (el < d - 30) return "Push the pace a little"; return "Ease down, head to your mat"; }
function renderSummary() {
  const R = PL.summary, s = R.sess;
  root.innerHTML = `<div class="player" style="--ph:var(--lift)"><div class="pin">
    <div class="p-top"><div class="brand"><i></i>Done</div><button class="icon-btn" data-act="close" aria-label="Close">${ICON.close}</button></div>
    <h1>${R.anyWork ? "Workout complete" : "Workout ended"}</h1>
    <div class="sum-grid"><div class="tile"><div class="v num">${fmt(s.dur)}</div><div class="l">Time</div></div><div class="tile"><div class="v num">${s.volume >= 10000 ? (s.volume / 1000).toFixed(1) + "k" : s.volume}</div><div class="l">lb lifted</div></div><div class="tile"><div class="v num">${Object.keys(PL.logs).length}</div><div class="l">Sets</div></div></div>
    ${R.result.length ? `<section><div class="block-h"><h3>Next time</h3></div><div class="list">${R.result.map(r => `<div class="item" style="grid-template-columns:1fr auto"><div><div class="nm">${esc(r.name)}${r.pr ? ` <span class="prog up">New best</span>` : ""}</div><div class="mt num">${r.sets.map(z => (z.w ? fmtW(z.w) + "×" : "") + z.r).join(", ")}</div></div><span class="prog ${r.cls}">${esc(r.note)}</span></div>`).join("")}</div></section>` : ""}
    ${s.abs.length ? `<p class="muted">Abs: ${s.abs.map(esc).join(", ")}</p>` : ""}
    <p class="note">Tomorrow is ${TYPES[NEXT_TYPE[s.type]].name}. Exercises you did today are pushed to the back of the queue so the next sessions stay fresh.</p>
    <button class="btn primary block" data-act="close">Back to today</button>
  </div></div>`;
}

/* ---------------- animation loop ---------------- */
const CON_FIRST = ["curl", "inclineCurl", "concentration", "spider", "row", "standRow", "standPress", "standFly", "pushdown", "standPressLow", "standPressHigh", "standFlyHigh", "standFlyLow", "bayesCurl", "facePull", "pulldown"];
function frame(ms) {
  if (PL && !PL.done) {
    const s = curStep(), cv = $("#pFig");
    if (s && cv) {
      const showId = s.k === "rest" ? (nextSetStep(PL.i + 1) || {}).id : s.id;
      const x = EXM[showId];
      if (x) {
        let t;
        if (s.k === "set" && PL.sub === "go" && S.settings.tempoCoach && !PL.paused) { const rs = repSec(x), f = ((stepEl() - PL.goAt) % rs) / rs, con = 1 / rs, first = CON_FIRST.includes(x.pat) ? con : 1 - con; t = f < first ? ease(f / first) : ease(1 - (f - first) / (1 - first)); }
        else if (PL.paused || (s.k === "set" && PL.sub !== "go")) t = 0;
        else t = demoT(x, ms, s.k === "rest" ? 3.2 : null);
        drawFigure(cv, x, t, COLORS[{ warm: "warm", abs: "abs", lift: "lift", cool: "cool" }[x.group === "abs" ? "abs" : x.group === "cool" ? "cool" : x.group === "warm" ? "warm" : "lift"]]);
      }
      const nf = $("#nextFig"), nx = nextSetStep(PL.i + 1);
      if (nf && nx && !nf.dataset.done) { const nxx = EXM[nx.id]; drawFigure(nf, nxx, .55, COLORS[nxx.group === "abs" ? "abs" : nxx.group === "cool" ? "cool" : "lift"]); nf.dataset.done = "1"; }
    }
  } else sheetLoop(ms);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------------- events ---------------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "swap") { e.stopPropagation(); e.preventDefault(); }
  switch (a) {
    case "tab": TAB = b.dataset.tab; SHEET = null; CONFIRM_RESET = false; render(); window.scrollTo(0, 0); break;
    case "type": S.plan = genPlan(b.dataset.t); save(); render(); break;
    case "reshuffle": S.plan = genPlan(todayPlan().type); save(); render(); break;
    case "swap": {
      const plan = todayPlan(), id = b.dataset.id, list = b.dataset.kind === "abs" ? plan.abs : plan.items;
      const it = list.find(z => z.id === id); if (!it) break;
      const used = list.map(z => z.id);
      const c = pool(it.slot, b.dataset.kind === "abs").filter(x => !used.includes(x.id));
      if (c.length) { it.id = c.map(x => [x.id, score(x.id)]).sort((p, q) => q[1] - p[1])[0][0]; save(); render(); }
      break;
    }
    case "sheet": SHEET = b.dataset.id; render(); break;
    case "closesheet": SHEET = null; render(); break;
    case "libf": LIBF = b.dataset.f; render(); break;
    case "start": startWorkout(); break;
    case "adj": {
      const id = b.dataset.id, f = b.dataset.f, d = +b.dataset.d, x = EXM[id], ctx = b.dataset.ctx;
      const stepW = incOf(x), mx = maxOf(x);
      if (ctx === "log") { const lf = logFor(); if (!lf) break; const L = lf.L; if (f === "w") { L.w = clamp(L.w + d * stepW, 0, mx); PL.cur[id].w = L.w; } else L.r = clamp(L.r + d, 0, 60); renderPlayer(); break; }
      if (ctx === "cur") { const c = PL.cur[id]; if (f === "w") c.w = clamp(c.w + d * stepW, 0, mx); else c.r = clamp(c.r + d, 1, 60); const st = exState(id); st.w = c.w; st.r = c.r; save(); renderPlayer(); break; }
      const st = exState(id); if (f === "w") st.w = clamp(st.w + d * stepW, 0, mx); else st.r = clamp(st.r + d, 1, 60); save(); render(); break;
    }
    case "testvoice": unlockAudio(); say("This is your Iron Pace coach. Set one. Ten reps. Ready. Go.", true); beep(880, .12); break;
    case "reset": CONFIRM_RESET = true; render(); break;
    case "resetno": CONFIRM_RESET = false; render(); break;
    case "resetyes": {
      const keep = S.settings; S = blank(); S.settings = keep; S.updatedAt = Date.now(); const old = SESSIONS; SESSIONS = []; lsSet(LS_SESS, SESSIONS); save();
      if (DB) old.forEach(s => { writeChain = writeChain.then(() => sessCol().doc(s.id).delete()).catch(() => { }); });
      CONFIRM_RESET = false; render(); break;
    }
    // player
    case "primary": if (!PL) break; if (PL.paused) { togglePause(); break; } { const s = curStep(); if (s.k === "set") { if (PL.sub === "go") { const c = PL.cur[s.id]; say("Rack it.", true); finishSet(S.settings.tempoCoach ? (PL.side ? c.r : (PL.count || c.r)) : c.r); } else { startSet(); renderPlayer(); } } else next(); } break;
    case "skip": next(); break;
    case "prev": prev(); break;
    case "pause": togglePause(); break;
    case "more": PL.extra += 15; PL.fired.delete("ten"); [1, 2, 3].forEach(n => PL.fired.delete("b" + n)); updatePlayer(); break;
    case "effort": { const lf = logFor(); if (lf) { lf.L.e = b.dataset.e; renderPlayer(); } break; }
    case "bump": { const id = b.dataset.id, x = EXM[id]; PL.cur[id].w = clamp(PL.cur[id].w + incOf(x), 0, maxOf(x)); exState(id).w = PL.cur[id].w; save(); say(`Next set at ${fmtW(PL.cur[id].w)} pounds.`, true); renderPlayer(); break; }
    case "swapcur": {
      const s = curStep(); if (!s || s.k !== "set") break;
      const it = PL.F.items[s.xi]; const used = PL.F.items.map(z => z.id);
      const c = pool(it.slot).filter(x => !used.includes(x.id)); if (!c.length) break;
      const nid = c.map(x => [x.id, score(x.id)]).sort((p, q) => q[1] - p[1])[0][0];
      const old = it.id; it.id = nid; const pi = PL.plan.items.find(z => z.id === old); if (pi) pi.id = nid;
      PL.steps.forEach(z => { if (z.id === old && z.k === "set" && (PL.steps.indexOf(z) >= PL.i)) z.id = nid; });
      const st = exState(nid); PL.cur[nid] = { w: st.w, r: st.r };
      say(`Swapped to ${EXM[nid].name}. ${EXM[nid].setup}`, true); enter(PL.i); break;
    }
    case "end": PL.confirmEnd = true; renderPlayer(); break;
    case "endno": PL.confirmEnd = false; renderPlayer(); break;
    case "endyes": PL.confirmEnd = false; finish(); break;
    case "close": closePlayer(); break;
  }
});
document.addEventListener("change", e => {
  const el = e.target.closest("[data-set]"); if (!el) return;
  const k = el.dataset.set;
  if (el.type === "checkbox") S.settings[k] = el.checked;
  else if (el.tagName === "SELECT" || el.dataset.kind === "text") S.settings[k] = el.value;
  else { const v = parseFloat(el.value); if (!isNaN(v)) S.settings[k] = clamp(v, +el.min, +el.max); }
  save(); if (k === "voiceURI") say("Voice selected.", true);
});
document.addEventListener("submit", e => {
  const f = e.target.closest("[data-form=bw]"); if (!f) return; e.preventDefault();
  const v = parseFloat($("#bwIn").value); if (isNaN(v) || v < 60 || v > 600) return;
  const today = dayKey(); S.bw = S.bw.filter(p => dayKey(new Date(p.d)) !== today).concat([{ d: Date.now(), w: v }]).slice(-365); save(); render();
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => render());
new MutationObserver(() => render()).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (!PL) { drawThumbs(); drawSparks(); } else { const nf = $("#nextFig"); if (nf) delete nf.dataset.done; } }, 150); });

render();
initSync();
</script>
